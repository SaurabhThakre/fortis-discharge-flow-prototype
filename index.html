function status(c){if(c.paused)return ['Paused','red'];if(c.exit)return ['Exited','green'];if(c.lounge)return ['In lounge','blue'];if(c.bill)return ['Ready to leave','green'];if(!c.intimation)return ['Intimation pending','amber'];if(!c.summary)return ['Summary pending','amber'];if(c.payer==='Insurance'&&!c.claim)return ['Insurance review','amber'];if(c.pharmacy<2)return ['Medicine returns','blue'];return ['Final billing','blue']}

function overview(){return heading('A clearer path to discharge.','See what is pending, who owns it, and what happens next.',guideBtn()+`<button class="btn primary" data-action="new">${icon('plus')}Initiate discharge</button>`)+stats()+`<div class="grid-main"><div><section class="panel"><div class="panel-head"><div><h2>Today’s discharge queue</h2><p class="sub">Track the whole journey from the doctor’s decision.</p></div><button class="textlink" data-nav="discharges">View all ${icon('arrow')}</button></div>${queueTable(true)}</section><section class="panel flow-panel"><div class="panel-head"><div><h2>One patient journey. Two finish lines.</h2><p class="sub">Teams work in parallel. Patient exit and bed readiness are recorded separately.</p></div></div><div class="flow">${[['1','Doctor decision','Clock starts here'],['2','Prepare & review','Summary · returns'],['3','Bill & insurance','Required approvals'],['4','Patient exit','Final care handover'],['5','Bed ready','Ward confirms']].map(([n,t,s])=>`<div class="flow-stage"><div class="flow-circle">${n}</div><b>${t}</b><small>${s}</small></div>`).join('')}</div></section></div><div class="right-column"><section class="panel"><div class="panel-head"><h2>Needs attention</h2>${badge('Action queue','amber')}</div><div class="attention">${state.cases.filter(c=>!c.exit&&(!c.intimation||!c.summary||c.payer==='Insurance'&&!c.docs||c.paused)).slice(0,3).map(c=>`<div class="attention-item">${icon('alert')}<div><b>${esc(pending(c))}</b><p>${esc(c.name)} · Bed ${c.bed}<br>${esc(c.owner)}</p><button class="textlink" data-case="${c.id}">Resolve next step →</button></div></div>`).join('')||'<div class="small">All flagged items have been addressed.</div>'}</div><div class="queue-bottom"><span>Clear ownership, fewer follow-ups.</span>${icon('check')}</div></section><section class="panel"><div class="panel-head"><div><h2>Work still open</h2><p class="sub">Counts in this demo, not measured savings.</p></div></div><div class="mini-bars">${[['Summary',active().filter(c=>!c.summary).length],['Insurance',active().filter(c=>c.payer==='Insurance'&&!c.claim).length],['Returns',active().filter(c=>c.pharmacy<2).length],['Final bill',active().filter(c=>!c.bill).length]].map(([t,n])=>`<div class="bar-row"><span>${t}</span><div class="bar-track"><i style="width:${n/Math.max(active().length,1)*100}%"></i></div><strong>${n} open</strong></div>`).join('')}</div></section></div></div>`}
function casePicker(insurance=false){const cs=state.cases.filter(c=>!insurance||c.payer==='Insurance');let c=current();if(insurance&&c.payer!=='Insurance'){state.selected=cs[0].id;c=current();save()}return `<div class="toolbar" style="padding:0;margin-bottom:22px"><label class="small" for="selected-case">Working on</label><select id="selected-case">${cs.map(p=>`<option value="${p.id}" ${p.id===c.id?'selected':''}>${esc(p.name)} · Bed ${esc(p.bed)} · ${p.payer}</option>`).join('')}</select>${badge(...status(c))}<button class="textlink" data-case="${c.id}">Open case details →</button></div>`}
function aiPage(){const pick=casePicker(),c=current();return heading('Less typing. More time to check.','Bring source records together, prepare a draft, and keep the doctor’s approval.',guideBtn())+pick+`<div class="note blue">${icon('info')}Sample AI workflow · Uses fixed fictional source records. No live OCR or AI model is connected. Do not upload real patient information.</div><div class="split"><section class="panel"><div class="panel-head"><div><h2>1. Source records</h2><p class="sub">Every draft should be traceable to a source.</p></div>${badge('Fictional','gray')}</div><div class="pad" style="padding-top:0"><div class="doc-text"><strong>DEMONSTRATION CASE SHEET</strong><br>Patient: ${esc(c.name)} · ${c.id}<br>Admission reason: Observation following dehydration.<br>Course: Hydration and clinical monitoring documented.<br>Condition: Stable, per sample doctor note.<br>Follow-up: Date not legible in sample scan.<br>Discharge medicines: Not present in sample records.</div><div class="source"><div class="source-head">${icon('doc')}Sample laboratory report ${badge('Available','green')}</div><p>Report attached to the fictional case file. Values require clinician review; no medical inference is generated.</p></div><div class="source"><div class="source-head">${icon('doc')}Doctor’s note ${badge('Needs review','amber')}</div><p>The follow-up date is unclear. The discharge medicine list is missing. Both items must be resolved by staff.</p></div><div class="actions" style="margin-top:20px"><button class="btn primary" data-action="draft" ${c.paused||c.exit||c.summary?'disabled':''}>${icon('spark')}${c.scan?'Regenerate sample draft':'Scan sample & draft'}</button></div><p class="privacy">The sample is intentionally incomplete to demonstrate review controls.</p></div></section><section class="panel"><div class="panel-head"><div><h2>2. Review the draft</h2><p class="sub">AI prepares; authorised staff and the doctor decide.</p></div>${badge(c.summary?'Doctor approved':c.scan?'Draft · unsigned':'Awaiting draft',c.summary?'green':'amber')}</div><div class="pad" style="padding-top:0">${c.scan?`<div class="note amber">${icon('alert')}Two source gaps: missing medicine list and unclear follow-up date. The draft leaves both unresolved.</div><label class="field">Current summary draft<textarea id="summary-draft" ${c.summary?'readonly':''}>${esc(c.draft)}</textarea></label><label class="check"><input id="source-review" type="checkbox" ${c.reviewed?'checked':''} ${c.summary?'disabled':''}><span>I checked the sources and resolved missing medicines and follow-up details in the draft.</span></label><div class="actions"><button class="btn" data-action="save-draft" ${c.summary||c.paused?'disabled':''}>Save corrections</button><button class="btn primary" data-action="approve-summary" ${c.summary||c.paused||!c.reviewed||/\[.*?\]/.test(c.draft)?'disabled':''}>${icon('check')}Doctor approves</button></div><p class="privacy">For the demo, replace the bracketed fields with “Sample medicines reviewed” and “Sample follow-up confirmed”, then save and confirm source review. No treatment advice is provided.</p>`:`<div class="empty" style="padding:75px 20px">${icon('spark')}<h3 style="margin-top:17px">A draft starts with the records.</h3><p>Run the sample scan to see source gaps and review the summary.</p></div>`}</div></section></div>`}
function insurancePage(){const pick=casePicker(true),c=current();return heading('Complete the file before it moves.','Check the insurer checklist, resolve missing papers, and record staff approval.',guideBtn())+pick+`<div class="note blue">${icon('info')}Simulated document check · The checklist below is illustrative. Real requirements vary by insurer and claim. Coverage and claim decisions stay with authorised teams.</div><div class="split"><section class="panel"><div class="panel-head"><div><h2>1. Document checklist</h2><p class="sub">Sample domestic insurance · final cashless claim</p></div>${badge(c.docs?'4 / 4 present':'3 / 4 present',c.docs?'green':'amber')}</div><div class="pad" style="padding-top:0">${[['Identity & policy details',true,'Sample identifiers consistent'],['Discharge summary',c.summary,c.summary?'Doctor approved':'Requires doctor approval'],['Laboratory reports',true,'Sample report attached'],['Signed final claim form',c.docs,c.docs?'Signed sample form added':'Signature page missing']].map(([t,ok,s])=>`<div class="checklist-row"><div>${esc(t)}<small>${esc(s)}</small></div>${badge(ok?'Present':'Action needed',ok?'green':'amber')}</div>`).join('')}<div class="actions" style="margin-top:20px"><button class="btn" data-action="add-form" ${c.docs||c.paused||c.exit?'disabled':''}>${icon('plus')}Add signed sample form</button><button class="btn primary" data-action="insurance-scan" ${c.paused||c.exit?'disabled':''}>${icon('spark')}Run sample check</button></div></div></section><section class="panel"><div class="panel-head"><h2>2. Staff review & submission</h2>${badge(c.claim?'Approval recorded':c.checked?'Checked':'Not checked',c.claim?'green':'gray')}</div><div class="pad" style="padding-top:0">${c.checked?`<div class="note ${!c.docs||!c.summary?'amber':''}">${icon(!c.docs||!c.summary?'alert':'check')}${!c.docs?'Missing signed final claim form. ':''}${!c.summary?'Discharge summary needs doctor approval. ':''}${c.docs&&c.summary?'No missing items found in this fixed sample. Staff still need to check the complete file.':''}</div><div class="statusline"><span>Policy / patient match</span>${badge('Sample match','green')}</div><div class="statusline"><span>Required signatures</span>${badge(c.docs?'Present':'Missing',c.docs?'green':'red')}</div><div class="statusline"><span>Final clinical approval</span>${badge(c.summary?'Recorded':'Pending',c.summary?'green':'amber')}</div><p class="small" style="margin:20px 0">Insurance staff review the file and confirm that required financial approval has been received. Document completeness alone does not guarantee settlement.</p><button class="btn primary" data-action="claim-approve" ${c.claim||!c.docs||!c.summary||c.paused?'disabled':''}>${icon('check')}Record insurance approval</button>${c.claim?'<p class="small">Approval recorded in the case timeline. Final billing can continue.</p>':''}`:'<div class="empty" style="padding:75px 25px">'+icon('shield')+'<h3 style="margin-top:17px">Catch missing papers earlier.</h3><p>Run the sample check to review document and approval gaps.</p></div>'}</div></section></div>`}
function patientSteps(c){return [['Doctor decision',true,time(c.decision)],['Discharge paperwork',c.summary,c.summary?'Your summary has been approved.':'Your team is checking your discharge papers.'],['Bill & payment checks',c.bill,c.bill?'Your bill is cleared.':c.payer==='Insurance'?'The team is completing insurance and billing checks.':'Your team is checking the final bill.'],['Ready to leave',!!c.exit,c.exit?`You left the hospital at ${time(c.exit)}.`:c.lounge?'You are waiting in the discharge lounge. Your care team will help with the final steps.':'The team will confirm your medicines, advice and transport.']]}
function patientPage(){const pick=casePicker(),c=current();return heading('Keep patients in the loop.','A simple status view and consent-based messages, with a clear way to reach staff.',`<button class="btn" data-action="patient-preview">${icon('chat')}Open patient view</button>`)+pick+`<div class="split"><section class="panel"><div class="panel-head"><div><h2>Patient / attendant messages</h2><p class="sub">WhatsApp-style demonstration · no messages are sent.</p></div>${badge('Simulated','blue')}</div><div class="pad" style="padding-top:0"><label class="check"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>Patient / attendant has agreed to receive discharge updates.</span></label><div class="note">${icon('shield')}Messages contain a short status only. In a real system, detailed bills and medical information require secure access.</div><div class="message"><b>Fortis discharge team</b><br>Hello ${esc(c.name.split(' ')[0])}, ${c.paused?'your discharge plan is being reviewed. Your care team will keep you informed.':c.bill?'your bill is cleared. Please wait for the nurse to confirm your medicines and departure instructions.':c.summary?'your discharge papers have been approved. We are completing the remaining checks.':'your discharge process has started. The team is preparing your papers and will update you on the next step.'}<br>Your contact: Discharge coordinator · Ward 5<small>Sample approved template · no detailed medical information</small></div><div class="actions"><button class="btn primary" data-action="send-message" ${!state.consent?'disabled':''}>${icon('chat')}Simulate status update</button><button class="btn" data-action="bill">View sample bill</button></div><h3 style="margin-top:28px">Message history</h3>${state.messages.filter(m=>m.case===c.id).slice().reverse().map(m=>`<div class="message neutral">${esc(m.text)}<small>${time(m.at)} · ${esc(m.status)}</small></div>`).join('')||'<p class="small">No simulated updates yet. Delivery is separate from patient acknowledgement.</p>'}</div></section><div><div class="phone">${patientView(c)}</div></div></div>`}
function patientView(c){return `<div class="phone-head"><b>fortis+ &nbsp; Your discharge</b><p class="sub">Patient view · fictional demonstration</p></div><div class="phone-body"><div class="eyebrow">Hello, ${esc(c.name.split(' ')[0])}</div><h2>Here’s where things stand.</h2><p class="small">${c.paused?'Your discharge plan is being reviewed. Please speak to your care team.':'Your care team will let you know when everything is ready. This is not a departure instruction.'}</p><div class="timeline" style="margin-top:25px">${patientSteps(c).map(([t,ok,s])=>`<div class="event"><span class="event-dot">${ok?icon('check'):icon('clock')}</span><div><b>${t}</b><small>${esc(s)}</small></div></div>`).join('')}</div><button class="btn primary" style="width:100%" data-action="ask">Ask your coordinator</button><p class="privacy">For urgent care needs, contact the ward nurse directly. This demo does not contact hospital staff.</p></div>`}
function bedsPage(){return heading('A vacated bed is just the start.','Alert housekeeping at ward vacancy, then record acceptance, cleaning and ward confirmation.',guideBtn())+`<div class="note">${icon('info')}Moving to the lounge can release the ward bed. It does not mean the patient has left the hospital. These timestamps remain separate.</div><div class="beds">${state.cases.map(c=>`<section class="bed ${c.house===3?'ready':''}"><div class="bed-head">${icon('bed')}${badge(c.house===3?'Ready':c.vacated?['','Awaiting cleaning','Cleaned · verify'][c.house]||'Task created':'Occupied',c.house===3?'green':c.vacated?'amber':'gray')}</div><h3>Bed ${esc(c.bed)}</h3><p class="small">${esc(c.name)}<br>${c.lounge?'Patient in discharge lounge':c.exit?'Patient exited hospital':'Ward patient'}</p><div class="progress"><i style="width:${c.house/3*100}%"></i></div><div class="statusline"><span>Ward vacancy</span><b>${c.vacated?time(c.vacated):'Pending'}</b></div><div class="statusline"><span>Housekeeping owner</span><b>${c.house?'Suma · HK team':'Unassigned'}</b></div>${c.vacated?`<button class="btn ${c.house===3?'soft':'primary'}" data-action="house" data-id="${c.id}" ${c.house===3?'disabled':''}>${['Accept cleaning task','Mark cleaning complete','Ward confirms bed ready','Bed ready'][c.house]}</button>`:`<button class="btn" data-case="${c.id}">Open patient handover ${icon('arrow')}</button>`}</section>`).join('')}</div><p class="privacy">Housekeeping task acceptance and bed-ready confirmation are separate events. No real WhatsApp alerts are sent.</p>`}
function page(){switch(view){case'overview':return overview();case'discharges':return heading('Every discharge, one shared queue.','Keep the next action, owner and elapsed time visible.',`<button class="btn" data-action="export">Export event log</button><button class="btn primary" data-action="new">${icon('plus')}Initiate discharge</button>`)+`<section class="panel"><div class="panel-head"><h2>Pilot ward cases</h2>${badge('From doctor initiation','green')}</div>${queueTable()}</section>`;case'ai':return aiPage();case'insurance':return insurancePage();case'messages':return patientPage();case'beds':return bedsPage();}}
function modal(title,body,wide=false){document.querySelector('#overlay').innerHTML=`<div class="modalback"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="iconbtn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div></section></div>`;document.querySelector('#overlay button')?.focus()}
function close(){document.querySelector('#overlay').innerHTML=''}
function task(t,owner,done,btn,action,disabled=false){return `<div class="taskrow"><div><b>${t}</b><small>${owner}</small></div><div class="actions">${done?badge('Complete','green'):`<button class="btn" data-action="${action}" ${disabled?'disabled':''}>${btn} ${icon('arrow')}</button>`}</div></div>`}
function openCase(id,tab=detailTab){state.selected=id;save();detailTab=tab;const c=current(),block=c.paused||!!c.exit;modal(`${esc(c.name)} <span style="font-size:12px;font-weight:400;color:#81917e">· ${c.id}</span>`,`<div class="case-meta"><span>Ward bed<b>${esc(c.bed)}</b></span><span>Payer<b>${c.payer}</b></span><span>Responsible doctor<b>${esc(c.doctor)}</b></span><span>Case owner<b>${esc(c.owner)}</b></span><span>Elapsed from doctor decision<b>${elapsed(c)}</b></span></div><div class="actions" style="margin-bottom:18px">${badge(...status(c))}<button class="textlink" data-action="assign">Change coordinator</button>${!c.exit?`<button class="textlink" data-action="pause">${c.paused?'Resume discharge':'Pause discharge'}</button>`:''}</div>${c.paused?`<div class="note amber">${icon('alert')}Paused: ${esc(c.reason)}. Resume requires staff to recheck affected approvals.</div>`:''}<div class="tabs" style="padding:0;margin-bottom:18px">${['tasks','timeline'].map(t=>`<button class="${tab===t?'active':''}" data-detail="${t}">${t==='tasks'?'Tasks & handovers':'Event timeline'}</button>`).join('')}</div>${tab==='timeline'?`<div class="timeline">${c.history.slice().reverse().map(e=>`<div class="event"><span class="event-dot">${icon('check')}</span><div><b>${esc(e.text)}</b><small>${time(e.at)}</small></div></div>`).join('')}</div>`:`<div class="note">${icon('clock')}Clock starts at the doctor’s decision (${time(c.decision)}). Intimation: ${time(c.intimation)}. Neither bill clearance nor lounge arrival is counted as hospital exit.</div>${task('Record discharge intimation','Ward secretary · capture HIS notification',!!c.intimation,'Record now','intimate',block)}${task('Prepare summary & obtain doctor approval','Secretary prepares · doctor approves',c.summary,'Open summary workspace','go-ai',block)}${c.payer==='Insurance'?task('Complete insurance checks & approval','Insurance desk · document review and financial approval',c.claim,'Open insurance checks','go-insurance',block):''}${task('Confirm medicine returns & bill update','Nursing collects · pharmacy confirms receipt',c.pharmacy===2,c.pharmacy===0?'Record collection':'Confirm receipt & bill update','returns',block)}${task('Clear final bill','Billing desk · required approvals and returns complete',c.bill,'Record bill clearance','clear-bill',block||!c.summary||c.pharmacy!==2||c.payer==='Insurance'&&!c.claim)}<div class="taskrow"><div><b>Clinical eligibility for lounge transfer</b><small>Clinical team decides suitability and care needs.</small></div><label class="check"><input id="eligible" type="checkbox" ${c.eligible?'checked':''} ${block||c.vacated?'disabled':''}> Eligible</label></div>${task('Transfer to discharge lounge','Nurse hands over to Kavya · Lounge nurse',!!c.lounge,'Record transfer & bed vacancy','lounge',block||!c.eligible||!c.summary||!!c.vacated)}${task('Record actual hospital exit','Ward / lounge nurse · medicines, advice and transport handed over',!!c.exit,'Confirm final handover & exit','exit',block||!c.bill||!c.summary)}<h3 style="margin-top:24px">Separate bed readiness record</h3><div class="statusline"><span>Ward bed vacated</span><b>${time(c.vacated)}</b></div><div class="statusline"><span>Lounge arrival</span><b>${time(c.lounge)}</b></div><div class="statusline"><span>Actual hospital exit</span><b>${time(c.exit)}</b></div><div class="statusline"><span>Bed cleaning / readiness</span>${badge(['Awaiting vacancy / task acceptance','Accepted · cleaning pending','Cleaned · ward check pending','Ward confirmed ready'][c.house],c.house===3?'green':'gray')}</div><button class="textlink" style="margin-top:14px" data-action="go-beds">Open bed readiness →</button>`}`,true)}
function guide(){modal('Try the complete discharge journey',`<p class="sub">Start with Ananya Rao, the fictional case with an incomplete file. Every step updates the shared queue and patient view.</p><div class="guide-list">${[['1','Start at the doctor’s decision','Open the case; see initiation, intimation and task owners.','guide-case'],['2','Draft and review the summary','Scan sample records, resolve both bracketed gaps, save, then approve.','guide-ai'],['3','Check the insurance file','Add the missing signed form, rerun checks and record staff approval.','guide-insurance'],['4','Complete the handovers','Collect and confirm returns, clear the bill, transfer to lounge or record exit.','guide-case'],['5','Follow the bed and patient','Accept cleaning, mark complete and confirm readiness. Preview patient updates and check the live bill.','guide-beds']].map(([n,t,s,a])=>`<button data-action="${a}"><span>${n}</span><div><b>${t}</b><small>${s}</small></div></button>`).join('')}</div><div class="note blue">${icon('info')}All records are fictional. AI checks and message delivery are simulated. Your changes persist in this browser; reset to restart the story.</div>`)}
function newCase(){modal('Initiate a discharge',`<p class="sub">Start the clock at the doctor’s decision. Administrative intimation can be recorded afterwards.</p><form id="new-case"><div class="formgrid"><label class="field">Fictional patient name<input name="name" required maxlength="50" placeholder="e.g. Demo Patient"></label><label class="field">Ward bed<input name="bed" required pattern="[A-Za-z0-9-]{1,8}" maxlength="8" placeholder="e.g. 520"></label><label class="field">Payer<select name="payer"><option>Cash</option><option>Insurance</option></select></label><label class="field">Responsible doctor<select name="doctor"><option>Dr. Meera Shah</option><option>Dr. Arjun Nair</option></select></label><label class="field">Doctor’s decision time<input type="datetime-local" name="decision" required value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></label><label class="field">Coordinator<select name="owner"><option>Priya · Coordinator</option><option>Kiran · Ward secretary</option></select></label></div><p id="form-error" class="formerror"></p><div class="note">${icon('info')}Use fictional information only. No hospital system is connected.</div><button class="btn primary" type="submit">${icon('plus')}Start discharge tracking</button></form>`)}
function updateCase(action){const c=current();if(c.exit){toast('This case has already exited.');return}if(c.paused){toast('Resume the case before completing tasks.');return}switch(action){case'intimate':if(c.intimation)return;c.intimation=now();log(c,'Discharge intimation recorded by ward secretary');break;case'returns':if(c.pharmacy>=2)return;c.pharmacy++;log(c,c.pharmacy===1?'Nursing recorded medicine-return collection':'Pharmacy confirmed return receipt and bill update');break;case'clear-bill':if(!c.summary||c.pharmacy<2||c.payer==='Insurance'&&!c.claim)return;c.bill=true;log(c,'Final bill clearance confirmed by billing desk');break;case'lounge':if(!c.summary||!c.eligible||c.vacated)return;c.vacated=now();c.lounge=now();log(c,'Ward bed vacated; housekeeping task created');log(c,'Lounge arrival recorded; care and pending tasks handed to Kavya, lounge nurse');break;case'exit':if(!c.bill||!c.summary)return;modal('Confirm final patient handover',`<p class="sub">Confirm these checks before recording actual hospital exit for ${esc(c.name)}.</p><form id="exit-form">${['Approved summary and discharge instructions handed over','Take-home medicines checked and explained by clinical staff','Patient / attendant understands next steps and transport is ready'].map(t=>`<label class="check"><input type="checkbox" required>${t}</label>`).join('')}<button class="btn primary" type="submit">Record actual hospital exit</button></form>`);return;}render();openCase(c.id);toast('Case updated. Event recorded in timeline.')}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;search='';payer='All payers';filter='All cases';close();render();window.scrollTo(0,0);return}const cr=e.target.closest('[data-case]');if(cr){openCase(cr.dataset.case,'tasks');return}const dt=e.target.closest('[data-detail]');if(dt){openCase(state.selected,dt.dataset.detail);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,c=current();if(['intimate','returns','clear-bill','lounge','exit'].includes(a)){updateCase(a);return}switch(a){case'close':close();break;case'guide':guide();break;case'new':newCase();break;case'go-ai':case'go-insurance':case'go-beds':view=a.slice(3);close();render();break;case'guide-case':state.selected='DF-2401';save();close();render();openCase(state.selected,'tasks');break;case'guide-ai':case'guide-insurance':case'guide-beds':state.selected='DF-2401';save();view=a.slice(6);close();render();break;
case'draft':c.scan=true;c.reviewed=false;c.draft=`DISCHARGE SUMMARY — UNSIGNED DEMO DRAFT\nPatient: ${c.name} | Case: ${c.id}\n\nReason for admission: Observation following dehydration, per sample case sheet.\nHospital course: Hydration and monitoring were documented in the sample record.\nCondition: Stable, per sample doctor note; requires clinical confirmation.\n\nDischarge medicines: [MISSING — authorised clinical staff must add and verify]\nFollow-up date: [UNCLEAR — confirm with treating doctor]\n\nSource records: Case sheet; laboratory report; doctor’s note.\nThis draft does not introduce information absent from the sample sources.\nFinal clinical approval: Pending.`;log(c,'Sample scan generated an unsigned summary; two source gaps flagged');render();toast('Sample draft ready. Resolve the two source gaps.');break;
case'save-draft':c.draft=document.querySelector('#summary-draft').value;c.reviewed=!!document.querySelector('#source-review')?.checked;log(c,'Summary draft corrections saved');render();toast('Draft saved. Doctor approval remains separate.');break;
case'approve-summary':if(!c.reviewed||!c.draft||/\[.*?\]/.test(c.draft)){toast('Resolve bracketed gaps, save corrections and confirm source review.');return}c.summary=true;log(c,'Responsible doctor approved the reviewed discharge summary (demo)');render();toast('Doctor approval recorded.');break;
case'add-form':c.docs=true;c.checked=false;log(c,'Signed sample claim form added; document recheck required');render();toast('Signed sample form added. Run the check again.');break;case'insurance-scan':c.checked=true;log(c,'Sample insurer checklist checked; staff review still required');render();toast(c.docs&&c.summary?'Sample file is complete. Record staff approval.':'Missing items flagged for staff review.');break;case'claim-approve':if(!c.checked||!c.docs||!c.summary)return;c.claim=true;log(c,'Insurance staff recorded required financial approval (demo)');render();toast('Insurance approval recorded.');break;
case'house':{const bed=state.cases.find(p=>p.id===b.dataset.id);if(!bed.vacated||bed.house>=3)return;bed.house++;log(bed,['','Housekeeping accepted cleaning task','Housekeeping recorded cleaning completion','Ward checked and confirmed bed ready'][bed.house]);render();toast(['','Cleaning task accepted by Suma.','Cleaning recorded. Ward confirmation is next.','Ward confirmed: bed ready.'][bed.house]);break}
case'send-message':if(!state.consent)return;state.messages.push({case:c.id,text:c.paused?'Your discharge plan is being reviewed. Your care team will keep you informed.':c.bill?'Your bill is cleared. Please wait for the nurse to confirm your final handover.':c.summary?'Your discharge papers have been approved. Remaining checks are in progress.':'Your discharge process has started. Your care team is preparing the papers.',at:now(),status:'Simulated delivery · acknowledgement pending'});log(c,'Consented status update simulated; no external message sent');render();toast('Simulated update added. No message was sent.');break;
case'patient-preview':modal('Patient status preview',`<div class="phone">${patientView(c)}</div>`);break;case'ask':modal('Ask your discharge coordinator',`<p class="sub">Choose a question to create a demonstration follow-up task. No message is sent to hospital staff.</p><form id="question-form"><label class="field">Your question<select name="question"><option>What is the next step?</option><option>Can someone explain a bill item?</option><option>Can you help coordinate transport?</option></select></label><button class="btn primary" type="submit">Add demo follow-up</button></form>`);break;
case'bill':modal('Sample bill · fictional',`<p class="sub">Illustrative amounts only.</p>${billDetails(currentBill(c))}<p class="privacy">Pre-authorisation does not guarantee final claim settlement. This prototype does not calculate insurance coverage or patient share.</p><button class="btn" data-action="ask">Ask about a bill item</button>`);break;
case'assign':modal('Assign a coordinator',`<form id="assign-form"><label class="field">Named case owner<select name="owner">${['Priya · Coordinator','Kiran · Ward secretary','Dev · Insurance desk'].map(t=>`<option ${c.owner===t?'selected':''}>${t}</option>`).join('')}</select></label><button type="submit" class="btn primary">Assign & record handover</button></form>`);break;
case'pause':if(c.paused){modal('Resume and recheck affected work',`<p class="sub">Pause reason: ${esc(c.reason)}. Recheck any approvals affected by the changed discharge plan.</p><form id="resume-form"><label class="check"><input name="recheck" type="checkbox" checked>Reopen summary, insurance approval and bill clearance for review</label><label class="check"><input type="checkbox" required>I have checked the revised plan and confirmed which work remains valid.</label><button class="btn primary" type="submit">Resume discharge</button></form>`)}else modal('Pause this discharge',`<form id="pause-form"><label class="field">Reason<input name="reason" required maxlength="160" placeholder="e.g. New investigation requested"></label><button class="btn primary" type="submit">Pause & record reason</button></form>`);break;
case'reset-dialog':modal('Restart the demonstration?',`<p class="sub">This replaces all changes in this browser with the six original fictional cases.</p><div class="actions" style="margin-top:22px"><button class="btn" data-action="close">Keep current demo</button><button class="btn danger" data-action="reset">Reset fictional cases</button></div>`);break;case'reset':state=seed();save();close();view='overview';render();toast('Demo reset.');break;
case'export':{const rows=[['case_id','fictional_patient','doctor_decision','intimation','ward_vacancy','lounge_arrival','hospital_exit','event_time','event']];state.cases.forEach(p=>p.history.forEach(h=>rows.push([p.id,p.name,p.decision,p.intimation,p.vacated,p.lounge,p.exit,h.at,h.text])));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const link=document.createElement('a');link.href=url;link.download='Fortis_Fictional_Discharge_Event_Log.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Fictional event log exported.');break}}
});
document.addEventListener('change',e=>{const c=current();if(e.target.id==='payer-filter'){payer=e.target.value;render()}if(e.target.id==='status-filter'){filter=e.target.value;render()}if(e.target.id==='selected-case'){state.selected=e.target.value;save();render()}if(e.target.id==='source-review'){c.reviewed=e.target.checked;c.draft=document.querySelector('#summary-draft').value;save();render()}if(e.target.id==='consent'){state.consent=e.target.checked;save();render();toast(state.consent?'Demo message consent enabled.':'Consent withdrawn. Status update simulation is disabled.')}if(e.target.id==='eligible'){c.eligible=e.target.checked;log(c,`Clinical lounge eligibility ${c.eligible?'confirmed':'removed'} (demo)`);render();openCase(c.id)}});
document.addEventListener('input',e=>{if(e.target.id==='case-search'){search=e.target.value;const pos=e.target.selectionStart;render();const input=document.querySelector('#case-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();const row=e.target.closest('.case-row');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCase(row.dataset.case)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),c=current();switch(f.id){case'new-case':{const date=new Date(d.get('decision'));const name=String(d.get('name')).trim(),bed=String(d.get('bed')).trim();let error='';if(!name)error='Enter a fictional patient name.';else if(!bed)error='Enter a bed number.';else if(date>Date.now()+60000||isNaN(date))error='Doctor decision cannot be in the future.';else if(state.cases.some(p=>p.bed===bed&&!p.vacated))error='This bed already has a patient. Choose another bed.';if(error){document.querySelector('#form-error').textContent=error;return}const id='DF-'+(2401+state.cases.length);const p={id,name,bed,payer:d.get('payer'),doctor:d.get('doctor'),owner:d.get('owner'),initials:name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),decision:date.toISOString(),intimation:null,summary:false,reviewed:false,draft:'',scan:false,docs:false,checked:false,claim:false,pharmacy:0,bill:false,eligible:false,vacated:null,lounge:null,exit:null,house:0,paused:false,reason:'',tasks:[],history:[{at:date.toISOString(),text:'Doctor initiated discharge'}]};state.cases.push(p);state.selected=id;save();close();view='discharges';render();openCase(id);toast('Discharge tracking started at the doctor’s decision.');return}
case'exit-form':if(c.paused||!c.bill||!c.summary)return;c.exit=now();if(!c.vacated){c.vacated=now();log(c,'Ward bed vacated at patient departure; housekeeping alerted')}log(c,'Final medicines, advice and transport handover confirmed; actual hospital exit recorded');break;case'assign-form':c.owner=d.get('owner');log(c,'Case ownership handed over to '+c.owner);break;case'pause-form':c.paused=true;c.reason=String(d.get('reason')).trim();log(c,'Discharge paused: '+c.reason);break;case'resume-form':c.paused=false;if(d.get('recheck')){c.summary=false;c.reviewed=false;c.claim=false;c.bill=false;log(c,'Affected summary, insurance and billing approvals reopened for review')}log(c,'Discharge resumed after staff recheck');break;case'question-form':c.tasks.push({question:d.get('question'),at:now()});log(c,'Patient follow-up assigned to '+c.owner+': '+d.get('question'));close();render();toast('Demo follow-up assigned to '+c.owner+'.');return;default:return}close();render();openCase(c.id);toast('Event recorded.');});
save();render();
</script><script>// V2: a task-first dashboard and a patient-side WhatsApp conversation.
navs.splice(1,1);
navs[0][2]='Discharge dashboard';
navs.find(n=>n[0]==='ai')[2]='Prepare summary';
navs.find(n=>n[0]==='messages')[2]='WhatsApp updates';
state.cases.forEach(c=>{if(typeof c.whatsappConsent!=='boolean')c.whatsappConsent=state.consent;c.chat=c.chat||[]});

function nextOwner(c){
 if(c.paused)return 'Treating doctor';
 if(c.bill)return c.lounge?'Kavya · Lounge nurse':'Ward nurse';
 if(!c.intimation)return 'Kiran · Ward secretary';
 if(!c.summary)return 'Secretary / treating doctor';
 if(c.payer==='Insurance'&&!c.claim)return 'Dev · Insurance desk';
 if(c.pharmacy<2)return c.pharmacy===0?'Ward nurse':'Pharmacy team';
 return 'Billing desk';
}
function nextTask(c){
 if(c.paused)return 'Review changed discharge plan';
 if(c.bill)return 'Complete final patient handover';
 if(!c.intimation)return 'Record discharge intimation';
 if(!c.summary)return 'Prepare and approve summary';
 if(c.payer==='Insurance'&&!c.claim)return c.docs?'Confirm insurance approval':'Add signed claim form';
 if(c.pharmacy<2)return c.pharmacy===0?'Collect medicine returns':'Confirm returns and bill update';
 return 'Clear final bill';
}
heading=function(title,sub,buttons=''){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`};
stats=function(){const patients=active(),ready=patients.filter(c=>c.bill&&!c.paused),beds=state.cases.filter(c=>c.vacated&&c.house<3);return `<div class="stats simple-stats"><button class="stat" data-action="dash-active"><div class="stat-top">Patients waiting to leave</div><div class="stat-value">${patients.length}</div></button><button class="stat" data-action="dash-ready"><div class="stat-top">Ready for final handover</div><div class="stat-value">${ready.length}</div></button><button class="stat highlight" data-nav="beds"><div class="stat-top">Beds awaiting cleaning / check</div><div class="stat-value">${beds.length}</div></button></div>`};
queueTable=function(){
 const cases=state.cases.filter(c=>!c.exit&&(`${c.name} ${c.id} ${c.bed}`.toLowerCase().includes(search.toLowerCase()))&&(payer==='All payers'||c.payer===payer)&&(filter!=='Ready for handover'||c.bill&&!c.paused));
 return `<div class="toolbar"><label class="search">${icon('search')}<input id="case-search" aria-label="Search patients" placeholder="Search patient or bed" value="${esc(search)}"></label><select id="payer-filter" aria-label="Filter by payer">${['All payers','Cash','Insurance'].map(t=>`<option ${payer===t?'selected':''}>${t}</option>`).join('')}</select><select id="status-filter" aria-label="Filter patients"><option ${filter!=='Ready for handover'?'selected':''}>All cases</option><option ${filter==='Ready for handover'?'selected':''}>Ready for handover</option></select></div><div class="tablewrap"><table class="task-table"><thead><tr><th>Patient</th><th>Next task</th><th>Who needs to act</th><th>Time since doctor decision</th><th></th></tr></thead><tbody>${cases.map(c=>`<tr class="case-row" data-case="${c.id}" tabindex="0" role="button" aria-label="Open ${esc(c.name)}"><td><div class="patient"><div class="avatar">${esc(c.initials)}</div><div><b>${esc(c.name)}</b><small>Bed ${esc(c.bed)} · ${c.payer}${c.lounge?' · In lounge':''}</small></div></div></td><td><span class="next-task ${c.bill?'task-ready':''}">${esc(nextTask(c))}</span>${c.paused?`<small class="task-hint">Paused: ${esc(c.reason)}</small>`:''}${c.tasks.filter(t=>!t.done).length?`<small class="task-hint">${c.tasks.filter(t=>!t.done).length} patient question(s) to answer</small>`:''}</td><td>${esc(nextOwner(c))}</td><td class="elapsed">${elapsed(c)}</td><td><button class="btn compact" data-case="${c.id}">Open ${icon('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No patients match this filter.</td></tr>'}</tbody></table></div>`;
};
overview=function(){return heading('Discharge dashboard','See each patient’s next task and the team responsible.',`<button class="btn" data-action="guide">How to use</button><button class="btn primary" data-action="new">${icon('plus')}Start a discharge</button>`)+stats()+`<section class="panel"><div class="panel-head"><h2>Patients waiting to leave</h2><button class="textlink" data-action="export">Export event log</button></div>${queueTable()}</section><p class="dashboard-footnote">Time starts when the doctor decides to discharge. Select a patient to update tasks, record lounge transfer or confirm hospital exit.</p>`};

const originalAIPage=aiPage;
aiPage=function(){let html=originalAIPage();html=html.replace('Less typing. More time to check.','Prepare discharge summary').replace('Bring source records together, prepare a draft, and keep the doctor’s approval.','Turn scanned case notes and reports into a draft that the doctor checks and approves.').replace('Bring source records together, prepare a draft, and keep the doctor\'s approval.','Turn scanned case notes and reports into a draft that the doctor checks and approves.');
 html=html.replace('<div class="split">',`<div class="summary-purpose"><div><strong>What is this for?</strong><p>To reduce repeated typing when preparing discharge papers.</p></div><ol><li>Scan case notes and reports</li><li>AI drafts the summary and flags gaps</li><li>Staff correct it; the doctor approves</li></ol></div><div class="split">`);
 html=html.replace('1. Source records','1. Case notes & reports').replace('2. Review the draft','2. Check & approve the summary').replace('Every draft should be traceable to a source.','The draft is based on these patient records.').replace('Scan sample & draft','Create draft from sample records');
 return html;
};
function updateText(c){
 if(c.paused)return `Hello ${c.name.split(' ')[0]}, your discharge plan is being reviewed. Your care team will explain the next steps.`;
 if(c.exit)return `Hello ${c.name.split(' ')[0]}, your hospital exit has been recorded. Please refer to the instructions provided by your care team.`;
 if(c.bill)return `Hello ${c.name.split(' ')[0]}, your bill is cleared. Please wait for your nurse to hand over the medicines and discharge instructions before leaving.`;
 if(!c.intimation)return `Hello ${c.name.split(' ')[0]}, your doctor has started the discharge process. We will update you as your papers and bill are prepared.`;
 if(!c.summary)return `Hello ${c.name.split(' ')[0]}, we are preparing your discharge summary. It will be checked by your doctor before the remaining steps are completed.`;
 if(c.payer==='Insurance'&&!c.claim)return `Hello ${c.name.split(' ')[0]}, your discharge summary is approved. The insurance team is completing the claim checks. We will let you know when there is an update.`;
 return `Hello ${c.name.split(' ')[0]}, your discharge papers are approved. We are completing the final medicine and billing checks.`;
}
const formatBillAmount=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
function currentBill(c){
 const items=[['Room & nursing',18000],['Investigations',4000],['Pharmacy',4200]];
 if(c.pharmacy===2)items.push(['Confirmed medicine returns',-1200]);
 return {items,cleared:c.bill};
}
function billDetails(bill){
 const total=bill.items.reduce((sum,[,amount])=>sum+amount,0);
 return `<p>${bill.cleared?'Final bill cleared':'Provisional bill · charges may change'}</p>
 <table class="wa-bill-table" aria-label="Itemized bill">
  <tbody>${bill.items.map(([label,amount])=>`<tr><td>${esc(label)}</td><td>${formatBillAmount.format(amount)}</td></tr>`).join('')}</tbody>
  <tfoot><tr><th scope="row">Total charges</th><th>${formatBillAmount.format(total)}</th></tr></tfoot>
 </table>`;
}
function fetchLiveBill(c){
 if(!c.whatsappConsent)return;
 const at=now();
 c.chat.push({from:'patient',text:'View live bill',at,read:true},
             {from:'hospital',billSnapshot:currentBill(c),at,read:true});
 save();
 render();
 const reply=document.querySelector('.wa-bill-response:last-child');
 reply?.focus({preventScroll:true});
 reply?.scrollIntoView({block:'nearest'});
}
function messageText(c,type){
 return type==='contact'
  ?`Your discharge coordinator is ${c.owner.split(' · ')[0]}. Reply here if you need help with the next step.`
  :updateText(c);
}
function chatMessages(c){
 const base=[{from:'hospital',text:`Hello ${c.name.split(' ')[0]}, this is the Fortis discharge team. Your doctor has started your discharge. Tap View live bill anytime to check your latest charges.`,at:c.decision,read:true},{from:'patient',text:'Thank you. Please let me know what is pending.',at:c.intimation||c.decision,read:true},{from:'hospital',text:updateText(c),at:c.history.at(-1)?.at||c.decision,read:true}];
 const old=state.messages.filter(m=>m.case===c.id).map(m=>({from:'hospital',text:m.text,at:m.at,read:!!m.read}));
 return [...base,...old,...c.chat.filter(m=>m.bill!==true)];
}
function waMessage(m){
 const isPatient=m.from==='patient';
 return `<div class="wa-bubble ${isPatient?'wa-out':'wa-in'}${m.billSnapshot?' wa-bill-response':''}" ${m.billSnapshot?'tabindex="-1"':''}>
  ${isPatient?'':'<span class="wa-sender">Fortis discharge team</span>'}
  ${m.billSnapshot?`<h3>Live bill</h3>${billDetails(m.billSnapshot)}`:`<div>${esc(m.text)}</div>`}
  <div class="wa-time">${m.billSnapshot?'Fetched at ':''}${time(m.at)} <span class="wa-ticks ${m.read?'read':''}">${isPatient?'✓✓':m.read?'Read':'Delivered'}</span></div>
 </div>`;
}
function whatsappView(c){return `<div class="wa-device"><div class="wa-statusbar"><span>${time(state.clock)}</span><span>▰ ▰ ▰</span></div><div class="wa-header"><span class="wa-back">‹</span><div class="wa-avatar">F</div><div><b>Fortis Discharge Team</b><small>Hospital care updates</small></div><span class="wa-menu">⋮</span></div><div class="wa-body"><div class="wa-date">TODAY</div><div class="wa-encryption">${icon('shield')}This is a prototype conversation. No messages are sent.</div>${chatMessages(c).map(waMessage).join('')}</div><div class="wa-bill-action"><button type="button" data-action="wa-live-bill" ${!c.whatsappConsent?'disabled':''}>${icon('check')} View live bill</button></div><div class="wa-replies"><button data-action="wa-quick" data-reply="What is still pending?" ${!c.whatsappConsent?'disabled':''}>What is pending?</button><button data-action="wa-quick" data-reply="Can someone explain a bill item?" ${!c.whatsappConsent?'disabled':''}>Question about bill</button></div><form class="wa-composer" id="wa-reply-form"><input name="reply" aria-label="Sample patient reply" placeholder="Type a patient reply…" required maxlength="300" ${!c.whatsappConsent?'disabled':''}><button type="submit" aria-label="Send simulated patient reply" ${!c.whatsappConsent?'disabled':''}>${icon('arrow')}</button></form></div>`}
patientPage=function(){const pick=casePicker(),c=current();const questions=c.tasks.filter(t=>!t.done);return heading('WhatsApp updates','Patients can check their current bill anytime from the WhatsApp chat.')+pick+`<div class="whatsapp-layout"><section class="panel message-controls"><div class="pad"><h2>Send a sample update</h2><p class="small">Preview a discharge status or coordinator message.</p><label class="field">Message type<select id="wa-template"><option value="status">Current discharge status</option><option value="contact">Coordinator contact</option></select></label><div class="message-preview">${esc(updateText(c))}</div><button class="btn primary" style="width:100%" data-action="wa-send" ${!c.whatsappConsent?'disabled':''}>Add message to chat ${icon('arrow')}</button><label class="check consent-check"><input type="checkbox" id="wa-consent" ${c.whatsappConsent?'checked':''}><span>Patient / attendant agreed to WhatsApp updates</span></label><div class="controls-rule"></div><h3>Patient questions</h3>${questions.length?questions.map((t,i)=>`<div class="followup-card"><b>${esc(t.question)}</b><small>Assigned to ${esc(c.owner)}</small><button class="textlink" data-action="wa-resolve" data-index="${c.tasks.indexOf(t)}">Mark handled</button></div>`).join(''):'<p class="small">Patient replies appear here as follow-up tasks for the coordinator.</p>'}<button class="textlink" data-action="wa-read">Mark hospital messages as read</button><p class="privacy">Fictional conversation · no WhatsApp connection. Delivered and read states are simulated. Detailed records would use secure links.</p></div></section><section class="chat-preview"><div class="preview-label">PATIENT’S WHATSAPP PREVIEW</div>${whatsappView(c)}</section></div>`};
function addPatientReply(text){const c=current();if(!c.whatsappConsent)return;c.chat.push({from:'patient',text,at:now(),read:true});c.tasks.push({question:text,at:now(),done:false});c.chat.push({from:'hospital',text:`Thanks for your message. Your discharge coordinator will follow up with you.`,at:now(),read:false});log(c,'Patient question assigned to '+c.owner+': '+text);render();toast('Sample patient reply added; coordinator follow-up created.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const c=current();switch(b.dataset.action){
 case'dash-active':search='';payer='All payers';filter='All cases';render();break;
 case'dash-ready':search='';payer='All payers';filter='Ready for handover';render();break;
 case'wa-send':{if(!c.whatsappConsent)return;const type=document.querySelector('#wa-template').value;c.chat.push({from:'hospital',text:messageText(c,type),at:now(),read:false});log(c,'Sample WhatsApp update added; no external message sent');render();toast('Sample message added to the WhatsApp preview.');break;}
 case'wa-live-bill':fetchLiveBill(c);break;
 case'wa-quick':addPatientReply(b.dataset.reply);break;
 case'wa-read':c.chat.filter(m=>m.from==='hospital').forEach(m=>m.read=true);state.messages.filter(m=>m.case===c.id).forEach(m=>m.read=true);save();render();toast('Read status updated in the sample conversation.');break;
 case'wa-resolve':{const t=c.tasks[Number(b.dataset.index)];if(t){t.done=true;log(c,'Coordinator handled patient question: '+t.question);render();toast('Follow-up marked handled.')}break;}
}});
document.addEventListener('submit',e=>{if(e.target.id!=='wa-reply-form')return;e.preventDefault();const text=String(new FormData(e.target).get('reply')||'').trim();if(text)addPatientReply(text)});
document.addEventListener('change',e=>{if(e.target.id==='wa-consent'){current().whatsappConsent=e.target.checked;save();render();toast(e.target.checked?'WhatsApp consent recorded for this patient.':'Updates disabled for this patient.')}if(e.target.id==='wa-template'){document.querySelector('.message-preview').textContent=messageText(current(),e.target.value)}});
const originalRender=render;
render=function(){if(view==='discharges')view='overview';state.cases.forEach(c=>{c.chat=c.chat||[];if(typeof c.whatsappConsent!=='boolean')c.whatsappConsent=state.consent});originalRender();};
save();render();
</script></body></html>
